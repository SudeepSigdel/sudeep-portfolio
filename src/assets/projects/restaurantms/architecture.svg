<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-labelledby="rms-arch-t rms-arch-d" lang="en">
<title id="rms-arch-t">RestaurantMS architecture</title>
<desc id="rms-arch-d">Five client roles use one Next.js app. It talks to a Django REST API and to Django Channels WebSockets, both authenticated with JWT. Domain apps sit inside a tenant boundary with server-side permissions. PostgreSQL stores data; Redis serves the cache and the WebSocket channel layer. Docker Compose and GitHub Actions deliver and test it.</desc>
