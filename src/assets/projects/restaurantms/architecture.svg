<text x="60.0" y="94.0" font-family="&#x27;Fraunces Variable&#x27;, &#x27;Iowan Old Style&#x27;, Georgia, serif" font-size="34" fill="#f6f8f7" font-weight="300">One tenant at a time.</text>
