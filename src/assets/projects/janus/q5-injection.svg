<title id="janus-q5-t">Q5 adaptive injection suite: attack success by category</title>
<desc id="janus-q5-d">Attack success rate per injection category with 95% Wilson intervals. Janus was hijacked in all 6 runs of the value-poisoning category and in none of the other 21 runs. browser_use was hijacked once in value poisoning, but 5 of those 6 runs never reached the attack. Nine cases, 27 runs per agent, v2 dev split.</desc>
