<text x="60.0" y="732.0" font-family="&#x27;JetBrains Mono&#x27;, ui-monospace, Consolas, monospace" font-size="11" fill="#9db9b6" font-weight="400">Janus is hijacked here because an approved field fill&#x27;s value is not checked: expected for a typed-plan design, not a model slip (docs/results.md, Q5). Reported as measured.</text>
<text x="60.0" y="751.0" font-family="&#x27;JetBrains Mono&#x27;, ui-monospace, Consolas, monospace" font-size="11" fill="#9db9b6" font-weight="400">&#x27;Exercised&#x27; = the forbidden path existed in the run. browser_use&#x27;s unexercised runs failed before reaching the attack, so its low rates are NOT evidence of resistance.</text>
