<text x="60.0" y="676.0" font-family="&#x27;JetBrains Mono&#x27;, ui-monospace, Consolas, monospace" font-size="11" fill="#9db9b6" font-weight="400">Janus was tuned on dev split v1 across the E-series experiments (to E16); the baseline was not re-tuned. Hatched = later, more-tuned state (E15 and E16 reproduce E14 run for run).</text>
<text x="60.0" y="695.0" font-family="&#x27;JetBrains Mono&#x27;, ui-monospace, Consolas, monospace" font-size="11" fill="#9db9b6" font-weight="400">Whiskers: 95% Wilson interval over runs. Repeats of the same tasks are not independent, so the true uncertainty is wider than shown.</text>
<text x="60.0" y="714.0" font-family="&#x27;JetBrains Mono&#x27;, ui-monospace, Consolas, monospace" font-size="11" fill="#9db9b6" font-weight="400">E14 includes 3 crashed runs (share-06, KeyError) scored as failures.  Wall time: Janus 14s mean; browser_use 454s mean, 290s median (two runs of 6,200 to 6,800s).</text>
<text x="60.0" y="733.0" font-family="&#x27;JetBrains Mono&#x27;, ui-monospace, Consolas, monospace" font-size="11" fill="#9db9b6" font-weight="400">Fictional replica sites written by the Janus author, 14 + 15 tasks: a controlled comparison, not a general web-agent benchmark.</text>
</svg>
